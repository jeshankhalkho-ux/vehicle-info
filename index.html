<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>VahanInfo Portal</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet"/>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.21.0/dist/tf.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
  <script src="lib/ultraplate.js"></script>
  <style>
    *{box-sizing:border-box;margin:0;padding:0;}
    body{font-family:'Inter',sans-serif;min-height:100vh;transition:background .3s,color .3s;}
    /* Light */
    body{background:#f4f6fb;color:#1a1a2e;}
    .topbar{background:#fff;border-bottom:1px solid #e8ecf8;}
    .search-area{background:#fff;border-bottom:1px solid #e8ecf8;}
    .search-box{background:#f4f6fb;border:1.5px solid #e2e8f0;}
    .search-box input{color:#1a1a2e;}
    .search-box input::placeholder{color:#94a3b8;}
    .hero-title{color:#1a1a2e;}
    .hero-sub{color:#64748b;}
    .plate-img{background:linear-gradient(135deg,#dde3f0,#eef1fa);}
    .example-card{background:#fff;border:1.5px solid #e8ecf8;color:#1a1a2e;}
    .example-card:hover{border-color:#6366f1;background:#fafbff;}
    .ex-num{color:#1a1a2e;}
    .ex-desc{color:#64748b;}
    .ex-icon{background:#eef2ff;}
    .recent-card{background:#fff;border:1.5px solid #e8ecf8;}
    .recent-card:hover{border-color:#6366f1;}
    .recent-num{color:#1a1a2e;}
    .recent-time{color:#94a3b8;}
    .recent-icon{background:#f4f6fb;}
    .sec-lbl{color:#1a1a2e;}
    .skel-card{background:#fff;border:1.5px solid #e8ecf8;}
    .skel{background:linear-gradient(90deg,#f0f3fb 25%,#e2e8f4 50%,#f0f3fb 75%);}
    .result-head{background:#fff;border-bottom:1px solid #e8ecf8;}
    .rc-stats{background:#e8ecf8;border:1px solid #e8ecf8;}
    .rc-stat{background:#fff;}
    .rc-stat-lbl{color:#94a3b8;}
    .rc-stat-val{color:#1a1a2e;}
    .info-card{background:#fff;border:1.5px solid #e8ecf8;}
    .info-row{border-bottom:1px solid #f4f6fb;}
    .info-row:last-child{border-bottom:none;}
    .info-row.hl{background:#fafbff;border-left:3px solid #6366f1;}
    .info-ico{background:#f4f6fb;}
    .info-val{color:#1a1a2e;}
    .info-val.na{color:#cbd5e1;}
    .err-card{background:#fff;border:1.5px solid #fee2e2;}
    .err-title{color:#1a1a2e;}
    .tbtn{background:#f8faff;border:1.5px solid #e2e8f0;}
    .lbtn{background:#f8faff;border:1.5px solid #e2e8f0;}
    .login-page{background:linear-gradient(135deg,#eef2ff,#f8faff);}
    .login-box{background:#fff;border:1px solid #e8ecf8;}
    .login-brand{color:#1a1a2e;}
    .login-field{background:#f8faff;border:1.5px solid #e2e8f0;}
    .login-field input{color:#1a1a2e;}
    .clr-hist{color:#94a3b8;}
    .brand-tag{background:#eef2ff;color:#6366f1;}
    .brand-name{color:#1a1a2e;}
    /* Dark */
    body.dark{background:#0d1117;color:#e6edf3;}
    body.dark .topbar{background:#161b22;border-color:#21262d;}
    body.dark .search-area{background:#161b22;border-color:#21262d;}
    body.dark .search-box{background:#0d1117;border-color:#21262d;}
    body.dark .search-box input{color:#e6edf3;}
    body.dark .search-box input::placeholder{color:#484f58;}
    body.dark .hero-title{color:#e6edf3;}
    body.dark .hero-sub{color:#8b949e;}
    body.dark .plate-img{background:linear-gradient(135deg,#1c2128,#21262d);}
    body.dark .example-card{background:#161b22;border-color:#21262d;color:#e6edf3;}
    body.dark .example-card:hover{border-color:#6366f1;background:#1c2128;}
    body.dark .ex-num{color:#e6edf3;}
    body.dark .ex-desc{color:#8b949e;}
    body.dark .ex-icon{background:#1c2128;}
    body.dark .recent-card{background:#161b22;border-color:#21262d;}
    body.dark .recent-card:hover{border-color:#6366f1;background:#1c2128;}
    body.dark .recent-num{color:#e6edf3;}
    body.dark .recent-time{color:#484f58;}
    body.dark .recent-icon{background:#1c2128;}
    body.dark .sec-lbl{color:#e6edf3;}
    body.dark .skel-card{background:#161b22;border-color:#21262d;}
    body.dark .skel{background:linear-gradient(90deg,#161b22 25%,#21262d 50%,#161b22 75%);}
    body.dark .result-head{background:#161b22;border-color:#21262d;}
    body.dark .rc-stats{background:#21262d;border-color:#21262d;}
    body.dark .rc-stat{background:#161b22;}
    body.dark .rc-stat-lbl{color:#8b949e;}
    body.dark .rc-stat-val{color:#e6edf3;}
    body.dark .info-card{background:#161b22;border-color:#21262d;}
    body.dark .info-row{border-color:#21262d;}
    body.dark .info-row.hl{background:#1c2128;}
    body.dark .info-ico{background:#0d1117;}
    body.dark .info-val{color:#e6edf3;}
    body.dark .info-val.na{color:#484f58;}
    body.dark .err-card{background:#161b22;border-color:#3d0000;}
    body.dark .err-title{color:#e6edf3;}
    body.dark .tbtn{background:#1c2128;border-color:#21262d;}
    body.dark .lbtn{background:#1c2128;border-color:#21262d;}
    body.dark .login-page{background:linear-gradient(135deg,#0d1117,#161b22);}
    body.dark .login-box{background:#161b22;border-color:#21262d;}
    body.dark .login-brand{color:#e6edf3;}
    body.dark .login-field{background:#0d1117;border-color:#21262d;}
    body.dark .login-field input{color:#e6edf3;}
    body.dark .login-field input::placeholder{color:#484f58;}
    body.dark .clr-hist{color:#484f58;}
    body.dark .brand-tag{background:#1c2128;color:#818cf8;}
    body.dark .brand-name{color:#e6edf3;}
    body.dark .info-sec-title::after{background:#21262d;}

    /* Layout */
    ::-webkit-scrollbar{width:5px;}::-webkit-scrollbar-thumb{background:#d0d5e8;border-radius:4px;}
    .app{max-width:480px;margin:0 auto;min-height:100vh;padding-bottom:40px;}
    .topbar{padding:14px 20px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:10;}
    .brand-row{display:flex;align-items:center;gap:10px;}
    .brand-icon{width:38px;height:38px;border-radius:10px;background:linear-gradient(135deg,#6366f1,#818cf8);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
    .brand-name{font-size:17px;font-weight:800;}
    .brand-name span{color:#6366f1;}
    .brand-tag{font-size:9px;font-weight:600;text-transform:uppercase;letter-spacing:1px;padding:2px 7px;border-radius:10px;margin-top:1px;}
    .tr{display:flex;align-items:center;gap:8px;}
    .tbtn,.lbtn{width:34px;height:34px;border-radius:9px;display:flex;align-items:center;justify-content:center;cursor:pointer;border:none;font-size:17px;transition:all .2s;}
    .search-area{padding:16px 20px;}
    .search-box{display:flex;align-items:center;gap:10px;border-radius:50px;padding:0 8px 0 18px;height:52px;transition:all .2s;}
    .search-box:focus-within{border-color:#6366f1!important;box-shadow:0 0 0 3px rgba(99,102,241,0.1);}
    .search-box input{flex:1;background:none;border:none;outline:none;font-size:15px;font-family:'Inter',sans-serif;font-weight:500;letter-spacing:1px;}
    .go-btn{width:38px;height:38px;border-radius:50%;background:linear-gradient(135deg,#6366f1,#818cf8);border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;box-shadow:0 2px 8px rgba(99,102,241,0.3);transition:all .2s;}
    .go-btn:hover:not(:disabled){transform:scale(1.05);}
    .go-btn:disabled{opacity:0.5;cursor:not-allowed;}
    .clr-btn{background:none;border:none;cursor:pointer;padding:4px;display:flex;color:#94a3b8;}
    .hero{padding:28px 20px 20px;text-align:center;}
    .plate-img{width:220px;height:100px;margin:0 auto 24px;border-radius:16px;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden;box-shadow:0 4px 20px rgba(99,102,241,0.1);}
    .plate-inner{background:#fff;border:3px solid #1a1a2e;border-radius:8px;padding:8px 18px;text-align:center;}
    .plate-ind{font-size:8px;font-weight:700;color:#1a1a2e;letter-spacing:2px;display:block;margin-bottom:2px;}
    .plate-num{font-size:20px;font-weight:800;color:#1a1a2e;letter-spacing:4px;}
    .plate-blue{width:12px;background:#003580;position:absolute;left:0;top:0;bottom:0;}
    .hero-title{font-size:26px;font-weight:800;line-height:1.2;margin-bottom:10px;}
    .hero-sub{font-size:14px;line-height:1.6;max-width:340px;margin:0 auto;}
    .sp{padding:0 20px;}
    .sec-lbl{font-size:13px;font-weight:700;margin-bottom:12px;display:flex;align-items:center;gap:8px;}
    .example-card{border-radius:16px;padding:16px;display:flex;align-items:center;gap:14px;margin-bottom:10px;cursor:pointer;transition:all .2s;box-shadow:0 1px 4px rgba(0,0,0,0.04);}
    .example-card:hover{transform:translateY(-1px);box-shadow:0 4px 16px rgba(99,102,241,0.12);}
    .ex-icon{width:46px;height:46px;border-radius:12px;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:22px;}
    .ex-num{font-size:16px;font-weight:700;letter-spacing:1px;}
    .ex-desc{font-size:12px;margin-top:2px;}
    .recent-card{border-radius:16px;padding:14px 16px;display:flex;align-items:center;gap:12px;margin-bottom:8px;cursor:pointer;transition:all .2s;}
    .recent-num{font-size:15px;font-weight:700;letter-spacing:1px;}
    .recent-time{font-size:11px;margin-top:2px;}
    .recent-icon{width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
    .clr-hist{background:none;border:none;cursor:pointer;font-size:11px;font-family:'Inter',sans-serif;text-decoration:underline;margin-left:auto;}
    .empty-r{text-align:center;padding:28px 0;}
    .empty-r-ico{width:52px;height:52px;border-radius:14px;background:#f4f6fb;display:flex;align-items:center;justify-content:center;margin:0 auto 12px;}
    @keyframes shimmer{0%{background-position:-400px 0}100%{background-position:400px 0}}
    .skel{background-size:400px 100%;animation:shimmer 1.3s ease-in-out infinite;border-radius:8px;}
    .skel-card{border-radius:16px;padding:18px;display:flex;align-items:center;gap:14px;margin-bottom:10px;}
    @keyframes spin{to{transform:rotate(360deg)}}
    .spin{width:16px;height:16px;border:2.5px solid rgba(255,255,255,0.4);border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite;}
    @keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
    .res-page{animation:fadeUp .35s ease;}
    .back-btn{display:flex;align-items:center;gap:6px;background:none;border:none;cursor:pointer;font-size:13px;font-weight:600;color:#6366f1;font-family:'Inter',sans-serif;margin-bottom:16px;padding:0;}
    .rc-plate{background:linear-gradient(135deg,#1a1a2e,#2d3561);border-radius:16px;padding:20px;display:flex;align-items:center;gap:16px;}
    .rc-plate-ico{width:56px;height:56px;border-radius:14px;background:rgba(255,255,255,0.1);border:1px solid rgba(255,255,255,0.15);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
    .rc-reg{font-size:24px;font-weight:800;color:#fff;letter-spacing:2px;}
    .rc-model{font-size:12px;color:rgba(255,255,255,0.6);margin-top:4px;text-transform:uppercase;letter-spacing:0.5px;}
    .rc-badges{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap;}
    .bdg{padding:4px 10px;border-radius:20px;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:0.5px;}
    .bdg-blue{background:rgba(99,102,241,0.2);color:#a5b4fc;}
    .bdg-green{background:rgba(34,197,94,0.2);color:#86efac;}
    .bdg-red{background:rgba(239,68,68,0.2);color:#fca5a5;}
    .bdg-amber{background:rgba(245,158,11,0.2);color:#fcd34d;}
    .rc-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;border-radius:12px;overflow:hidden;margin-top:16px;}
    .rc-stat{padding:12px 14px;}
    .rc-stat-lbl{font-size:10px;text-transform:uppercase;letter-spacing:1px;font-weight:600;margin-bottom:3px;}
    .rc-stat-val{font-size:13px;font-weight:700;}
    .info-sec{padding:0 20px;margin-top:16px;}
    .info-sec-title{font-size:11px;font-weight:700;color:#94a3b8;text-transform:uppercase;letter-spacing:1.5px;margin-bottom:10px;display:flex;align-items:center;gap:8px;}
    .info-sec-title::after{content:'';flex:1;height:1px;background:#e8ecf8;}
    .info-card{border-radius:14px;overflow:hidden;margin-bottom:10px;}
    .info-row{display:flex;align-items:center;gap:12px;padding:14px 16px;}
    .info-row.hl{border-left:3px solid #6366f1;}
    .info-ico{width:34px;height:34px;border-radius:9px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
    .info-lbl{font-size:11px;font-weight:600;color:#94a3b8;text-transform:uppercase;letter-spacing:0.8px;margin-bottom:2px;}
    .info-val{font-size:14px;font-weight:600;}
    .info-val.na{font-style:italic;font-weight:400;font-size:13px;}
    .info-val.green{color:#16a34a;}
    .info-val.red{color:#dc2626;}
    .err-sec{padding:20px;animation:fadeUp .3s ease;}
    .err-card{border-radius:20px;padding:36px 24px;text-align:center;}
    .err-ico{width:60px;height:60px;border-radius:16px;background:#fef2f2;display:flex;align-items:center;justify-content:center;margin:0 auto 16px;}
    .err-title{font-size:18px;font-weight:800;margin-bottom:8px;}
    .err-sub{font-size:14px;color:#64748b;line-height:1.6;margin-bottom:20px;}
    .retry-btn{display:inline-flex;align-items:center;gap:8px;background:#fef2f2;border:1.5px solid #fecaca;color:#dc2626;padding:10px 20px;border-radius:10px;cursor:pointer;font-size:13px;font-weight:700;font-family:inherit;}
    .login-page{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;}
    .login-box{border-radius:24px;padding:44px 36px;width:100%;max-width:400px;box-shadow:0 8px 40px rgba(99,102,241,0.1);}
    .login-logo-row{display:flex;align-items:center;gap:12px;margin-bottom:32px;justify-content:center;}
    .login-icon{width:52px;height:52px;border-radius:14px;background:linear-gradient(135deg,#6366f1,#818cf8);display:flex;align-items:center;justify-content:center;}
    .login-brand{font-size:22px;font-weight:800;}
    .login-brand span{color:#6366f1;}
    .login-sub{text-align:center;font-size:14px;color:#64748b;margin-bottom:28px;line-height:1.5;}
    .field-lbl{font-size:11px;font-weight:600;color:#64748b;text-transform:uppercase;letter-spacing:1px;margin-bottom:8px;display:block;}
    .login-field{display:flex;align-items:center;gap:10px;border-radius:12px;padding:0 14px;height:50px;transition:all .2s;margin-bottom:10px;}
    .login-field:focus-within{border-color:#6366f1!important;box-shadow:0 0 0 3px rgba(99,102,241,0.12);}
    .login-field.eb{border-color:#ef4444!important;}
    .login-field input{flex:1;background:none;border:none;outline:none;font-size:15px;font-family:'Inter',sans-serif;}
    .login-field input::placeholder{color:#94a3b8;}
    .pw-tog{background:none;border:none;cursor:pointer;display:flex;padding:2px;color:#94a3b8;}
    .err-msg{font-size:12px;color:#ef4444;margin-bottom:12px;display:flex;align-items:center;gap:5px;}
    .login-btn{width:100%;height:50px;border-radius:12px;border:none;cursor:pointer;background:linear-gradient(135deg,#6366f1,#818cf8);color:#fff;font-family:'Inter',sans-serif;font-weight:700;font-size:15px;box-shadow:0 4px 16px rgba(99,102,241,0.3);transition:all .2s;}
    .login-btn:hover{transform:translateY(-1px);}
    @keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-8px)}60%{transform:translateX(8px)}}
    .shake{animation:shake .4s ease;}

    /* Camera modal */
    .cam-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.95);z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;}
    .cam-header{position:absolute;top:0;left:0;right:0;padding:16px 20px;display:flex;align-items:center;justify-content:space-between;}
    .cam-title{font-size:16px;font-weight:700;color:#fff;}
    .cam-close{background:rgba(255,255,255,0.1);border:1px solid rgba(255,255,255,0.2);border-radius:8px;width:36px;height:36px;display:flex;align-items:center;justify-content:center;cursor:pointer;}
    .cam-body{width:100%;max-width:420px;padding:0 20px;}
    .cam-view{width:100%;aspect-ratio:4/3;border-radius:16px;overflow:hidden;position:relative;background:#111;border:2px solid #6366f1;}
    .cam-view video{width:100%;height:100%;object-fit:cover;}
    .cam-view canvas{display:none;}
    .cam-guide{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none;}
    .cam-frame{width:85%;height:22%;border:3px solid #6366f1;border-radius:8px;box-shadow:0 0 0 2000px rgba(0,0,0,0.4);position:relative;}
    .cam-frame::before,.cam-frame::after{content:'';position:absolute;width:20px;height:20px;border-color:#fff;border-style:solid;}
    .cam-frame::before{top:-3px;left:-3px;border-width:3px 0 0 3px;border-radius:4px 0 0 4px;}
    .cam-frame::after{bottom:-3px;right:-3px;border-width:0 3px 3px 0;border-radius:0 0 4px 0;}
    .cam-hint{text-align:center;margin-top:14px;font-size:13px;color:rgba(255,255,255,0.6);line-height:1.5;}
    .cam-actions{display:flex;gap:12px;margin-top:20px;width:100%;max-width:420px;padding:0 20px;}
    .cam-snap{flex:1;height:56px;border-radius:14px;border:none;cursor:pointer;background:linear-gradient(135deg,#6366f1,#818cf8);color:#fff;font-family:'Inter',sans-serif;font-weight:700;font-size:15px;display:flex;align-items:center;justify-content:center;gap:8px;box-shadow:0 4px 20px rgba(99,102,241,0.4);}
    .cam-snap:disabled{opacity:0.5;cursor:not-allowed;}
    .cam-result{background:rgba(99,102,241,0.15);border:1px solid rgba(99,102,241,0.3);border-radius:12px;padding:14px 16px;margin-top:14px;width:100%;max-width:420px;padding-left:20px;padding-right:20px;}
    .cam-result-lbl{font-size:10px;color:#94a3b8;text-transform:uppercase;letter-spacing:1px;font-weight:600;margin-bottom:4px;}
    .cam-result-num{font-size:22px;font-weight:800;color:#fff;letter-spacing:3px;font-family:'Inter',monospace;}
    .cam-use{background:linear-gradient(135deg,#6366f1,#818cf8);border:none;border-radius:10px;padding:10px 20px;color:#fff;font-weight:700;font-size:14px;cursor:pointer;font-family:'Inter',sans-serif;margin-top:10px;width:100%;display:flex;align-items:center;justify-content:center;gap:8px;}
    .cam-btn{width:38px;height:38px;border-radius:50%;background:rgba(99,102,241,0.15);border:1.5px solid rgba(99,102,241,0.3);display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all .2s;flex-shrink:0;}
    .cam-btn:hover{background:rgba(99,102,241,0.25);}
    .ocr-loading{text-align:center;padding:16px;color:rgba(255,255,255,0.6);font-size:13px;display:flex;flex-direction:column;align-items:center;gap:10px;}
    .ocr-spinner{width:28px;height:28px;border:3px solid rgba(99,102,241,0.3);border-top-color:#6366f1;border-radius:50%;animation:spin .8s linear infinite;}

    /* ── Camera Scanner ── */
    .cam-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.95);z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;}
    .cam-header{position:absolute;top:0;left:0;right:0;padding:16px 20px;display:flex;align-items:center;justify-content:space-between;}
    .cam-title{color:#fff;font-size:17px;font-weight:700;}
    .cam-close{background:rgba(255,255,255,0.1);border:1px solid rgba(255,255,255,0.2);border-radius:10px;width:38px;height:38px;display:flex;align-items:center;justify-content:center;cursor:pointer;color:#fff;}
    .cam-video{width:100%;max-width:400px;border-radius:16px;overflow:hidden;position:relative;}
    .cam-video video{width:100%;display:block;border-radius:16px;}
    .cam-frame{position:absolute;inset:0;pointer-events:none;}
    .cam-frame::before,.cam-frame::after{content:'';position:absolute;width:60px;height:60px;border-color:#6366f1;border-style:solid;}
    .cam-frame::before{top:16px;left:16px;border-width:3px 0 0 3px;border-radius:4px 0 0 0;}

function normalize(raw, regNo) {
  const r1    = (raw.results && raw.results.result1) ? raw.results.result1 : {};

  const own   = r1["Ownership Details"] || {};

  const other = r1["Other Information"] || {};
  const basic = r1["Basic Card Info"] || {};
  const insValidKey = Object.keys(ins).find(k => k.startsWith("Insurance Valid"));
  return {
    regNo:       cl(raw.registration_number || own["Registration Number"] || basic["Registration Number"]) || regNo,
    ownerName:   cl(own["Owner Name"] || basic["Owner Name"] || r2["Owner Name"]),
    fatherName:  cl(own["Father's Name"] || r2["Father's Name"]),
    ownerSerial: cl(own["Owner Serial No"] || own["Owner Serial No."] || r2["Owner Serial No"]),
    rto:         cl(own["Registered RTO"] || basic["Registered RTO"] || r2["Registered RTO"]),

  };
}

async function fetchVehicle(number) {
  let res, json;
  try {
    res = await fetch(`${WORKER}/api/vehicle?number=${encodeURIComponent(number)}&secret=${encodeURIComponent(SECRET)}`, {
      signal: AbortSignal.timeout(25000)
    });
    json = await res.json();
  } catch(e) {
    throw new Error("Could not connect to server. Please try again.");
  }
  if (json.error) throw new Error(json.error);
  if (!res.ok) throw new Error(json.message || "Server error.");
  return normalize(json, number);
}

function CameraScanner({ onDetected, onClose }) {
  const videoRef = useRef(null);
  const streamRef = useRef(null);
  const [scanning, setScanning] = useState(false);
  const [detected, setDetected] = useState(null);
  const [camErr, setCamErr] = useState(null);
  const [status, setStatus] = useState("Point camera at number plate");
  const [manualMode, setManualMode] = useState(false);
  const [manualText, setManualText] = useState("");

  // Extract Indian plate from raw OCR text
  function extractPlate(text) {
    const clean = text.toUpperCase().replace(/[^A-Z0-9\s]/g, ' ').replace(/\s+/g, '');
    // Try strict pattern first
    let m = clean.match(/[A-Z]{2}[0-9]{1,2}[A-Z]{1,3}[0-9]{4}/);
    if (m) return m[0];
    // Loose pattern - allow O/0, I/1 confusion
    const loose = clean.replace(/O/g,'0').replace(/I/g,'1').replace(/S/g,'5').replace(/B/g,'8');
    m = loose.match(/[A-Z]{2}[0-9]{1,2}[A-Z]{1,3}[0-9]{4}/);
    if (m) return m[0];
    return null;
  }

  // Preprocess canvas for OCR - multiple strategies
  function preprocessCanvas(srcCanvas, mode) {
    const c = document.createElement('canvas');
    // Scale up 2x for better OCR accuracy
    c.width = srcCanvas.width * 2;
    c.height = srcCanvas.height * 2;
    const ctx = c.getContext('2d');
    ctx.imageSmoothingEnabled = false;
    ctx.drawImage(srcCanvas, 0, 0, c.width, c.height);

    if (mode === 'raw') return c;

    const imgData = ctx.getImageData(0, 0, c.width, c.height);
    const d = imgData.data;

    if (mode === 'gray') {
      for (let i = 0; i < d.length; i += 4) {
        const g = 0.299*d[i] + 0.587*d[i+1] + 0.114*d[i+2];
        d[i] = d[i+1] = d[i+2] = g;
      }
    } else if (mode === 'high_contrast') {
      for (let i = 0; i < d.length; i += 4) {
        const g = 0.299*d[i] + 0.587*d[i+1] + 0.114*d[i+2];
        // Adaptive: enhance contrast
        const v = g < 100 ? 0 : g > 160 ? 255 : ((g - 100) / 60) * 255;
        d[i] = d[i+1] = d[i+2] = v;
      }
    } else if (mode === 'invert') {
      for (let i = 0; i < d.length; i += 4) {
        const g = 0.299*d[i] + 0.587*d[i+1] + 0.114*d[i+2];
        d[i] = d[i+1] = d[i+2] = 255 - g;
      }
    }
    ctx.putImageData(imgData, 0, 0);
    return c;
  }

  useEffect(() => {
    navigator.mediaDevices.getUserMedia({
      video: {
        facingMode: { ideal: 'environment' },
        width: { ideal: 1920 }, height: { ideal: 1080 },
        focusMode: { ideal: 'continuous' }
      }
    }).then(stream => {
      streamRef.current = stream;
      if (videoRef.current) {
        videoRef.current.srcObject = stream;
        videoRef.current.play();
      }
    }).catch(() => {
      setCamErr("Camera access denied. Please allow camera permission.");
    });
    return () => { if (streamRef.current) streamRef.current.getTracks().forEach(t => t.stop()); };
  }, []);

  const capture = async () => {
    if (!videoRef.current || scanning) return;
    setScanning(true);
    setDetected(null);
    setStatus("Capturing image...");

    const video = videoRef.current;
    const full = document.createElement('canvas');
    full.width = video.videoWidth || 1280;
    full.height = video.videoHeight || 720;
    full.getContext('2d').drawImage(video, 0, 0);

    let found = null;

    // Try UltraPlate first (YOLO detection + enhanced OCR)
    const plateWorker = window.plateWorkerRef?.current;
    if (plateWorker && plateWorker.isReady && plateWorker.isReady()) {
      setStatus("Running YOLO detection + OCR...");
      try {
        const dUrl = full.toDataURL('image/jpeg', 0.92);
        const result = await plateWorker.recognize(dUrl);
        if (result.plate) {
          found = result.plate;
        } else if (result.text) {
          found = extractPlate(result.text);
        }
      } catch(e) {
        console.warn("UltraPlate failed, falling back:", e);
      }
    }

    // Fallback: try Tesseract with multiple preprocessing modes
    if (!found) {
      const modes = ['raw', 'gray', 'high_contrast', 'invert'];
      for (let i = 0; i < modes.length && !found; i++) {
        setStatus(`Analyzing image (attempt ${i+1}/4)...`);
        try {
          const processed = preprocessCanvas(full, modes[i]);
          const result = await Tesseract.recognize(processed, 'eng', {
            tessedit_char_whitelist: 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789',
            tessedit_pageseg_mode: '6',
            preserve_interword_spaces: '0',
          });
          found = extractPlate(result.data.text) || found;

          const result2 = await Tesseract.recognize(processed, 'eng', {
            tessedit_char_whitelist: 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789',
            tessedit_pageseg_mode: '11',
            preserve_interword_spaces: '0',
          });
          found = extractPlate(result2.data.text) || found;
        } catch {}
      }
    }

    if (found) {
      setDetected(found);
      setStatus("Plate detected!");
    } else {
      setDetected("NOTFOUND");
      setStatus("Could not detect — try again or enter manually");
    }
    setScanning(false);
  };

  const useDetected = () => {
    if (streamRef.current) streamRef.current.getTracks().forEach(t => t.stop());
    onDetected(detected);
    onClose();
  };

  const useManual = () => {
    const p = manualText.trim().toUpperCase().replace(/\s/g,'');
    if (p.length >= 6) {
      if (streamRef.current) streamRef.current.getTracks().forEach(t => t.stop());
      onDetected(p);
      onClose();
    }
  };

  return (
    <div className="cam-overlay">
      <div className="cam-header">
        <div className="cam-title">📷 Scan Number Plate</div>
        <button className="cam-close" onClick={onClose}><Ico n="close" s={18} c="white"/></button>
      </div>

      {camErr ? (
        <div style={{textAlign:'center',padding:'0 30px',color:'#fff'}}>
          <div style={{fontSize:48,marginBottom:16}}>🚫</div>
          <div style={{fontSize:16,fontWeight:700,marginBottom:8}}>Camera Error</div>
          <div style={{fontSize:14,color:'rgba(255,255,255,0.6)',lineHeight:1.6,marginBottom:20}}>{camErr}</div>
          <button className="cam-snap" style={{width:'100%'}} onClick={()=>setManualMode(true)}>
            Enter Number Manually
          </button>
        </div>
      ) : manualMode ? (
        <div style={{width:'100%',maxWidth:420,padding:'0 20px',textAlign:'center'}}>
          <div style={{fontSize:18,fontWeight:700,color:'#fff',marginBottom:16}}>Enter Number Plate</div>
          <input value={manualText} onChange={e=>setManualText(e.target.value.toUpperCase())}
            placeholder="e.g. MH12AB1234"
            style={{width:'100%',height:52,background:'rgba(255,255,255,0.1)',border:'1.5px solid rgba(99,102,241,0.5)',
              borderRadius:12,color:'#fff',fontSize:20,fontWeight:700,letterSpacing:3,textAlign:'center',
              outline:'none',fontFamily:'Inter,monospace',marginBottom:12}}/>
          <button className="cam-use" onClick={useManual} style={{marginBottom:10}}>
            <Ico n="search" s={16} c="white"/> Search Vehicle
          </button>
          <button onClick={()=>setManualMode(false)}
            style={{background:'none',border:'none',color:'rgba(255,255,255,0.5)',cursor:'pointer',fontSize:13,fontFamily:'inherit'}}>
            ← Back to Camera
          </button>
        </div>
      ) : (
        <>
          <div className="cam-body">
            <div className="cam-view" style={{aspectRatio:'16/9'}}>
              <video ref={videoRef} playsInline muted style={{width:'100%',height:'100%',objectFit:'cover'}}/>
              {/* Simple guide overlay */}
              <div style={{position:'absolute',inset:0,display:'flex',alignItems:'center',justifyContent:'center',pointerEvents:'none'}}>
                <div style={{width:'90%',height:'30%',border:'2px solid #6366f1',borderRadius:8,
                  boxShadow:'0 0 0 1000px rgba(0,0,0,0.35)',position:'relative'}}>
                  {/* Corner markers */}
                  {[['top:0,left:0','borderWidth:3px 0 0 3px'],['top:0,right:0','borderWidth:3px 3px 0 0'],
                    ['bottom:0,left:0','borderWidth:0 0 3px 3px'],['bottom:0,right:0','borderWidth:0 3px 3px 0']
                  ].map(([pos,bw],i)=>{
                    const p = Object.fromEntries(pos.split(',').map(x=>x.split(':')));
                    const b = Object.fromEntries(bw.split(',').map(x=>x.split(':')));
                    return <div key={i} style={{position:'absolute',width:20,height:20,borderColor:'#fff',borderStyle:'solid',borderRadius:2,...p,...b}}/>;
                  })}
                </div>
              </div>
            </div>

            {/* Status */}
            <div style={{textAlign:'center',marginTop:12,fontSize:13,
              color: scanning ? '#a5b4fc' : detected==='NOTFOUND' ? '#fca5a5' : detected ? '#86efac' : 'rgba(255,255,255,0.6)',
              fontWeight:scanning?600:400,letterSpacing:0.3}}>
              {scanning ? <><span style={{animation:'pulse 1s infinite'}}>⏳</span> {status}</> : status}
            </div>
          </div>

          <div className="cam-actions">
            <button className="cam-snap" onClick={capture} disabled={scanning}>
              {scanning
                ? <><div className="ocr-spinner" style={{width:18,height:18,borderWidth:2}}/>Scanning...</>
                : <><Ico n="camera" s={18} c="white"/>Capture & Scan</>}
            </button>
          </div>

          {detected && detected !== "NOTFOUND" && (
            <div style={{width:'100%',maxWidth:420,padding:'0 20px',marginTop:12}}>
              <div className="cam-result">
                <div className="cam-result-lbl">✅ Plate Detected</div>
                <div className="cam-result-num">{detected}</div>
                <button className="cam-use" onClick={useDetected}>
                  <Ico n="search" s={16} c="white"/> Search This Vehicle
                </button>
              </div>
            </div>
          )}

          {detected === "NOTFOUND" && !scanning && (
            <div style={{width:'100%',maxWidth:420,padding:'0 20px',marginTop:12,display:'flex',gap:10}}>
              <button onClick={capture} className="cam-snap" style={{flex:1,height:44,fontSize:13}}>
                <Ico n="refresh" s={15} c="white"/> Retry
              </button>
              <button onClick={()=>setManualMode(true)} className="cam-snap"
                style={{flex:1,height:44,fontSize:13,background:'rgba(99,102,241,0.3)'}}>
                ✏️ Enter Manually
              </button>
            </div>
          )}

          <div style={{marginTop:14,textAlign:'center'}}>
            <button onClick={()=>setManualMode(true)}
              style={{background:'none',border:'none',color:'rgba(255,255,255,0.4)',
                cursor:'pointer',fontSize:12,fontFamily:'inherit',textDecoration:'underline'}}>
              Can't scan? Enter manually
            </button>
          </div>
        </>
      )}
    </div>
  );
}

function App() {
  const [loggedIn,setLoggedIn] = useState(false);
  const [showCam,setShowCam] = useState(false);
  const [dark,setDark] = useState(()=>localStorage.getItem('rc_theme')==='dark');
  const [query,setQuery] = useState("");
  const [loading,setLoading] = useState(false);
  const [data,setData] = useState(null);
  const [error,setError] = useState("");
  const [history,setHistory] = useState(()=>{
    try{return JSON.parse(localStorage.getItem('rc_hist')||'[]');}catch{return [];}
  });
  const plateWorkerRef = useRef(null);

  useEffect(()=>{
    document.body.className = dark?'dark':'';
    localStorage.setItem('rc_theme',dark?'dark':'light');
  },[dark]);

  useEffect(()=>{
    (async()=>{
      if(typeof UltraPlate !== 'undefined' && !plateWorkerRef.current){
        try{
          const w = await UltraPlate.createWorker({ lang: 'eng' });
          plateWorkerRef.current = w;
          window.plateWorkerRef = plateWorkerRef;
        }catch(e){
          console.error("UltraPlate init error:", e);
        }
      }
    })();
    return ()=>{
      if(plateWorkerRef.current){
        plateWorkerRef.current.terminate().catch(()=>{});
      }
    };
  },[]);

  const logout = ()=>{setLoggedIn(false);setData(null);setError("");setQuery("");};

  const doSearch = useCallback(async(num)=>{
    const q=(num||query).trim().toUpperCase();
    if(!q||loading)return;
    setLoading(true);setData(null);setError("");
    try{
      const r = await fetchVehicle(q);
      setData(r);
      const h=[{num:q,time:new Date().toLocaleTimeString()},...history.filter(x=>x.num!==q)].slice(0,6);
      setHistory(h);
      try{localStorage.setItem('rc_hist',JSON.stringify(h));}catch{}
    }catch(e){setError(e.message||"Something went wrong.");}
    finally{setLoading(false);}
  },[query,loading,history]);

  if(!loggedIn) return <Login onLogin={()=>setLoggedIn(true)}/>;

  const Topbar = ()=>(
    <div className="topbar">
      <div className="brand-row">
        <div className="brand-icon"><Ico n="car" s={20} c="white"/></div>
        <div>
          <div className="brand-name">Vahan<span>Info</span> Portal</div>
          <div className="brand-tag">National Registry Data</div>
        </div>
      </div>
      <div className="tr">
        <button className="tbtn" onClick={()=>setDark(d=>!d)}
          style={{background:dark?'#1c2128':'#f8faff',border:`1.5px solid ${dark?'#21262d':'#e2e8f0'}`}}>
          {dark?'☀️':'🌙'}
        </button>
        <button className="lbtn" onClick={logout}
          style={{background:dark?'#1c2128':'#f8faff',border:`1.5px solid ${dark?'#21262d':'#e2e8f0'}`}}>
          <Ico n="logout" s={16} c="#94a3b8"/>
        </button>
      </div>
    </div>
  );

  if(data) return <div className="app"><Topbar/><Result d={data} onBack={()=>{setData(null);setError("");setQuery("");}}/></div>;

  return (
    <div className="app">
      <Topbar/>
      <div className="search-area">
        <div className="search-box">
          <Ico n="search" s={18} c="#94a3b8"/>
          <input type="text" placeholder="Enter Vehicle Number..."
            value={query} onChange={e=>setQuery(e.target.value.toUpperCase())}
            onKeyDown={e=>e.key==="Enter"&&doSearch()} disabled={loading}/>
          {query&&<button className="clr-btn" onClick={()=>setQuery("")}><Ico n="close" s={15} c="#94a3b8"/></button>}
          <button className="cam-btn" onClick={()=>setShowCam(true)} title="Scan plate with camera">
            <Ico n="camera" s={17} c="#6366f1"/>
          </button>
          <button className="go-btn" onClick={()=>doSearch()} disabled={loading||!query.trim()}>
            {loading?<div className="spin"/>:<Ico n="search" s={16} c="white"/>}
          </button>
        </div>
      </div>

      {loading&&<div style={{padding:'20px'}}>
        {[1,2,3,4].map(i=>(
          <div className="skel-card" key={i}>
            <div className="skel" style={{width:46,height:46,borderRadius:12,flexShrink:0}}/>
            <div style={{flex:1,display:'flex',flexDirection:'column',gap:8}}>
              <div className="skel" style={{width:'40%',height:10}}/>
              <div className="skel" style={{width:'65%',height:14}}/>
            </div>
          </div>
        ))}
        <div style={{textAlign:'center',padding:8,fontSize:12,color:'#94a3b8',fontWeight:600,letterSpacing:1}}>
          Querying VAHAN Database...
        </div>
      </div>}

      {error&&!loading&&<div className="err-sec">
        <div className="err-card">
          <div className="err-ico"><Ico n="alert" s={28} c="#ef4444"/></div>
          <div className="err-title">Record Not Found</div>
          <div className="err-sub">{error}</div>
          <button className="retry-btn" onClick={()=>doSearch()}>
            <Ico n="refresh" s={14} c="#dc2626"/> Try Again
          </button>
        </div>
      </div>}

      {showCam && (
        <CameraScanner
          onDetected={(plate) => { setQuery(plate); doSearch(plate); }}
          onClose={() => setShowCam(false)}
        />
      )}

      {!loading&&!error&&<>
        <div className="hero">
          <div className="plate-img">
            <div className="plate-blue"/>
            <div className="plate-inner">
              <span className="plate-ind">🇮🇳 IND</span>
              <span className="plate-num">MH·12·AB</span>
            </div>
          </div>
          <div className="hero-title">Comprehensive Vehicle Insights</div>
          <div className="hero-sub">Enter an Indian vehicle registration number to instantly retrieve RTO records, ownership details, and fitness documentation.</div>
        </div>

        <div className="sp" style={{marginTop:8}}>
          <div className="sec-lbl"><Ico n="car" s={16} c="#6366f1"/> Quick Examples</div>
          {EXAMPLES.map(ex=>(
            <div className="example-card" key={ex.num} onClick={()=>{setQuery(ex.num);doSearch(ex.num);}}>
              <div className="ex-icon">{ex.icon}</div>
              <div>
                <div className="ex-num">{ex.num}</div>
                <div className="ex-desc">{ex.desc}</div>
              </div>
              <div style={{marginLeft:'auto',color:'#6366f1',opacity:0.5}}>→</div>
            </div>
          ))}
        </div>

        <div className="sp" style={{marginTop:20}}>
          <div className="sec-lbl">
            <Ico n="history" s={15} c="#6366f1"/> Recent Searches
            {history.length>0&&<button className="clr-hist" onClick={()=>{setHistory([]);try{localStorage.removeItem('rc_hist');}catch{}}}>Clear all</button>}
          </div>
          {history.length===0
            ?<div className="empty-r">
               <div className="empty-r-ico"><Ico n="history" s={24} c="#cbd5e1"/></div>
               <p style={{fontSize:14,fontWeight:600,color:'#64748b',marginBottom:4}}>No recent searches</p>
               <span style={{fontSize:12,color:'#94a3b8'}}>Look up a vehicle to see it here</span>
             </div>
            :history.map((h,i)=>(
              <div className="recent-card" key={i} onClick={()=>{setQuery(h.num);doSearch(h.num);}}>
                <div className="recent-icon"><Ico n="car" s={18} c="#6366f1"/></div>
                <div>
                  <div className="recent-num">{h.num}</div>
                  <div className="recent-time">Searched at {h.time}</div>
                </div>
                <div style={{marginLeft:'auto',color:'#6366f1',opacity:0.4}}>→</div>
              </div>
            ))
          }
        </div>
      </>}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
